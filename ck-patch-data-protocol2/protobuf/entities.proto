    int32 id = 1;
    TcMiniGameSeasonType merge_type = 2;
    TString season_name = 3;
    DateTime start_date = 4;
    DateTime end_date = 5;
    NullableDateTime reward_date = 6;
    bool is_season_reward_available = 7;
    bool use_ranking = 8;
    NullableInt reward_mail_id = 9;
    int32 contents_guide_id = 10;
    NullableInt require_item_id = 11;
    NullableInt require_item_quantity = 12;
    NullableInt link_event_id = 13;
    int32 merge_reward_item_ids = 14;
    string bgm_event_path = 15;
}

// ExcelFile: TcGuideMissionData
message WeekendBounus {
    int32 tab_id = 1;
    int32 bonus_event_id = 2;
}

// ExcelFile: TradingData
message WishtreeDailyGift {
    int32 achievement_order = 1;
    int32 required_quantity = 2;
    repeated int32 reward_ids = 3;
    repeated int32 reward_quantities = 4;
    RewardChestType reward_chest_type = 5;
}

// ExcelFile: CookieDialogData
message WishtreeDialog {
    int32 char_id = 1;
    TString dialog = 2;
    Vector2 wishtree_offset = 3;
    int32 weight = 4;
}

// ExcelFile: TradingData
message WishtreeQuest {
    int32 id = 1;
    repeated RequirementType trigger_requirement_types = 2;
    repeated NullableIntList trigger_requirement_values = 3;
    repeated RequirementType close_requirement_types = 4;
    repeated NullableIntList close_requirement_values = 5;
    int32 payment_id = 6;
    int32 payment_quantity_min = 7;
    int32 payment_quantity_max = 8;
    int32 trade_item_weight = 9;
    repeated int32 reward_ids = 10;
    repeated int32 reward_quantities = 11;
    bool is_golden_wish = 12;
    int32 wishtree_daily_reward_counting = 13;
}

// ExcelFile: TcPaperData
message ZonePaperShop {
    int32 paper_item_id = 1;
    string paper_id = 2;
    string paper_name = 3;
    string paper_thumb = 4;
    int32 paper_size = 5;
    string author = 6;
    int32 theme_season_id = 7;
    NullableInt price_item_id = 8;
    NullableInt price_quantity = 9;
    NullableInt price_item_id2 = 10;
    NullableInt price_quantity2 = 11;
    bool removed = 12;
}

// ExcelFile: TcPaperData
message ZonePaperStorage {
    int32 paper_storage_level = 1;
    int32 paper_storage_max_slot = 2;
    int32 material_ids = 3;
    int32 material_quantities = 4;
}

// ExcelFile: TcPaperData
message ZonePaperTheme {
    int32 theme_season_id = 1;
    string theme_season_name = 2;
    string theme_season_description = 3;
    int32 theme_season_type = 4;
    DateTime start_date = 5;
    DateTime end_date = 6;
    DateTime start_sale_date = 7;
    DateTime end_sale_date = 8;
}

